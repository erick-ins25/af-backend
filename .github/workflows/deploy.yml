
name: Deploy AF

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build Maven
        run: ./mvnw -B clean package -DskipTests

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/af-api:${{ github.sha }}

      - name: Deploy AWS
        uses: appleboy/ssh-action@v1
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          AUTH0_ISSUER: ${{ secrets.AUTH0_ISSUER }}
          AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}

        with:
          host: ${{ secrets.HOST_TEST }}
          username: ubuntu
          key: ${{ secrets.KEY_TEST }}
          port: 22
          envs: DB_PASSWORD,AUTH0_ISSUER,AUTH0_AUDIENCE,DOCKERHUB_USERNAME,IMAGE_TAG

          script: |
            set -eu

            IMAGE="$DOCKERHUB_USERNAME/af-api:$IMAGE_TAG"

            docker pull "$IMAGE"

            docker stop af-api || true
            docker rm af-api || true

            docker run -d \
              --name af-api \
              --restart unless-stopped \
              --network avaliacoes-network \
              -p 8080:8080 \
              -e DB_HOST=avaliacoes-postgres \
              -e DB_PORT=5432 \
              -e DB_NAME=avaliacoes \
              -e DB_USER=postgres \
              -e DB_PASSWORD="$DB_PASSWORD" \
              -e AUTH0_ISSUER="$AUTH0_ISSUER" \
              -e AUTH0_AUDIENCE="$AUTH0_AUDIENCE" \
              "$IMAGE"
